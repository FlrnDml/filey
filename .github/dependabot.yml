version: 2

# One pull request per week with every available update (npm and GitHub Actions together).
# Review and merge it with the `dependency-updates` skill (.claude/skills/dependency-updates/SKILL.md).
multi-ecosystem-groups:
  weekly-updates:
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: deps
    labels:
      - dependencies

updates:
  - package-ecosystem: npm
    directory: /
    multi-ecosystem-group: weekly-updates
    patterns: ['*']
    ignore:
      # Pinned on purpose: Drizzle 1.0 is a release candidate (arc42 §11, risk 9).
      - dependency-name: drizzle-orm
      - dependency-name: drizzle-kit
      # typescript-eslint (latest 8.71.2) only supports TypeScript <6.1.0, so TypeScript 7 breaks `npm ci`.
      # Remove once typescript-eslint supports TypeScript 7.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # Types must match the pinned runtime (Node 24, .nvmrc); Node 25+ types describe APIs that do not exist.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    multi-ecosystem-group: weekly-updates
    patterns: ['*']
