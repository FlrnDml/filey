<!-- @dsCard group="Forms" height=120 subtitle="Label, field, hint" -->
<style>html,body{margin:0}body{background:var(--bg);color:var(--text);font:400 15px/22px var(--font-sans);padding:var(--space-4)}
label{display:block;font:500 13px/16px var(--font-sans);margin-bottom:var(--space-1)}
.in{box-sizing:border-box;width:280px;height:36px;padding:0 var(--space-3);border:1px solid var(--border-control);border-radius:var(--radius-md);background:var(--bg);color:var(--text);font:400 15px var(--font-sans)}
.in:focus-visible{outline:2px solid var(--focus-ring);outline-offset:2px}
.hint{font:400 13px/18px var(--font-sans);color:var(--text-muted);margin-top:var(--space-1)}</style>
<label for="n">Folder name</label><input id="n" class="in" value="Invoices 2026"><div class="hint">Shown in the sidebar.</div>
