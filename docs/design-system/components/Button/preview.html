<!-- @dsCard group="Actions" height=88 subtitle="Primary, secondary, danger" -->
<style>html,body{margin:0}body{background:var(--bg);color:var(--text);font:400 15px/22px var(--font-sans);padding:var(--space-4);display:flex;gap:var(--space-4);flex-wrap:wrap;align-items:center}
.btn{font:500 13px/16px var(--font-sans);height:36px;padding:0 var(--space-4);border-radius:var(--radius-md);cursor:pointer;border:1px solid transparent}
.btn:focus-visible,.in:focus-visible{outline:2px solid var(--focus-ring);outline-offset:2px}
.p{background:var(--accent);color:var(--on-accent)}.p:hover{background:var(--accent-hover)}
.s{background:var(--bg);color:var(--text);border-color:var(--border-control)}.s:hover{background:var(--surface)}
.d{background:var(--bg);color:var(--danger);border-color:var(--border-control)}.d:hover{background:var(--surface)}</style>
<button class="btn p">Move</button><button class="btn s">Cancel</button><button class="btn d">Delete 3 files</button>
