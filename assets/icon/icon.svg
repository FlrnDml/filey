<!--
  Filey app icon (source). The brand mark from docs/design-system/components/TrayIcon: a flatbed scanner,
  outline only, round caps, drawn on the 20px icon grid with a 1.5 stroke, in white on the accent colour
  (#1d4ed8, with a slightly lighter top edge of the same blue). The rounded square follows the macOS icon
  grid: an 824px body inset 100px on the 1024px canvas, with a soft drop shadow below.
  Used for 64px and up; icon-small.svg is the 16px/32px version.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a5fe6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#body)" filter="url(#shadow)"/>
  <g transform="translate(512 520) scale(32) translate(-10 -10.75)" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2.5 11.5h15v4a1.5 1.5 0 0 1-1.5 1.5H4a1.5 1.5 0 0 1-1.5-1.5z M4.5 11.5 6 4.5h8l1.5 7 M14.5 14.2h.01"/>
  </g>
</svg>
